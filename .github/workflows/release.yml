name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      already_published: ${{ steps.release.outputs.already_published }}
    steps:
      - name: 检查发布凭据
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$GITEE_TOKEN" || { echo '缺少 GITEE_TOKEN'; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo '缺少 TAURI_SIGNING_PRIVATE_KEY'; exit 1; }

      - id: release
        name: 跳过已经完成的同 Tag 发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$release_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          if [[ "$status" == 200 && "$(jq -r '.draft' "$release_file")" == false ]]; then
            echo 'already_published=true' >> "$GITHUB_OUTPUT"
          elif [[ "$status" == 200 || "$status" == 404 ]]; then
            echo 'already_published=false' >> "$GITHUB_OUTPUT"
          else
            echo "读取 GitHub Release 失败，HTTP ${status}" >&2
            exit 1
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.already_published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - run: node scripts/set-release-version.mjs "${{ github.ref_name }}"

      - run: pnpm install --frozen-lockfile

      - if: matrix.platform == 'macos-latest'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '小鱼缸 __VERSION__'
          releaseBody: '安装包与自动更新文件已同步至 Gitee。'
          releaseDraft: true
          args: ${{ matrix.args }}
          uploadUpdaterSignatures: true

  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 从 GitHub 草稿 Release 下载全部构建产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-artifacts
          gh release download "${{ github.ref_name }}" --dir release-artifacts

      - name: 安装签名验证工具
        run: sudo apt-get update && sudo apt-get install --yes minisign

      - name: 同步代码、安装包和更新清单到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: yu-shengming
          GITEE_REPO: qiu
          RELEASE_TAG: ${{ github.ref_name }}
          ARTIFACT_DIR: release-artifacts
        run: bash scripts/publish-gitee.sh

      - name: Gitee 成功后发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
